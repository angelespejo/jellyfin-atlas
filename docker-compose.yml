services:
  jellyfin-atlas:
    image: jellyfin-atlas:latest
    container_name: jellyfin-atlas
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Compose interpolates these from `.env` (or your shell environment).
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      JELLYFIN_USER_ID: ${JELLYFIN_USER_ID:-}
      # Set to true to serve the bundled demo library without Jellyfin.
      JELLYFIN_MOCK: ${JELLYFIN_MOCK:-false}
      PORT: 3000 # default: 3000
